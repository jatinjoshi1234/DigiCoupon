<form class="card" (ngSubmit)="save()">
    <div class="d-flex flex-row justify-content-between align-items-end mb-4">
        <h5 class="mb-0 pb-2 border-bottom w-100">
            Vendor Registration
        </h5>
        <p-button label="Save" icon="pi pi-save" type="submit" outlined>
        </p-button>
    </div>
    <div class="card p-0">
        <p-tabs value="1" class="tab-container">
            <p-tablist class="mb-1">
                <p-tab value="1">Details</p-tab>
                <p-tab value="2">Address</p-tab>
                <p-tab value="3">Images</p-tab>
            </p-tablist>
            <p-tabpanels>
                <p-tabpanel value="1">
                    <!-- Vendor Information -->
                    <div class="row">
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="vendorName"> Vendor Name * </label>
                                <input pInputText class="w-full" id="vendorName" [formField]="vendorForm.vendorName">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="businessName"> Business Name * </label>
                                <input pInputText class="w-full" id="businessName"
                                    [formField]="vendorForm.businessName">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="businessEmail"> Business Email * </label>
                                <input pInputText class="w-full" id="businessEmail"
                                    [formField]="vendorForm.businessEmail">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="businessPhone">Business Phone * </label>
                                <input pInputText class="w-full" id="businessPhone"
                                    [formField]="vendorForm.businessPhone">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <div class="flex flex-col grow">
                                <p-select [options]="vendorTypes()" optionLabel="name" optionValue="code"
                                    [filter]="true" filterBy="name" (onFilter)="getVendorType($event.filter)"
                                    placeholder="Select vendor type" [(ngModel)]="vendorType" name="vendorType">
                                </p-select>
                            </div>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <div class="flex flex-col grow">
                                <p-select [options]="vendorCategories()" optionLabel="name" optionValue="code"
                                    [filter]="true" filterBy="name" (onFilter)="getVendorCategory($event.filter)"
                                    placeholder="Select vendor category" [(ngModel)]="vendorCategory"
                                    name="vendorCategory">
                                </p-select>
                            </div>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="website"> Website</label>
                                <input pInputText class="w-full" id="website" [formField]="vendorForm.website">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="gst"> GST Number *</label>
                                <input pInputText class="w-full" id="gst" [formField]="vendorForm.gstNumber">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="pan"> PAN Number * </label>
                                <input pInputText class="w-full" id="pan" [formField]="vendorForm.panNumber">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="tin">TIN Number </label>
                                <input pInputText class="w-full" id="tin" [formField]="vendorForm.tinNumber">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="tin">TAN Number </label>
                                <input pInputText class="w-full" id="tin" [formField]="vendorForm.tanNumber">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="tin">CIN Number </label>
                                <input pInputText class="w-full" id="tin" [formField]="vendorForm.cinNumber">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="website"> FSSAI Number</label>
                                <input pInputText class="w-full" id="website" [formField]="vendorForm.fssaiNumber">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="website"> License Number</label>
                                <input pInputText class="w-full" id="website" [formField]="vendorForm.licenseNumber">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="website"> Bank account</label>
                                <input pInputText class="w-full" id="website" [formField]="vendorForm.bankAccountNo">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="website"> Account Holder Name</label>
                                <input pInputText class="w-full" id="website" [formField]="vendorForm.accountHolder">
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on">
                                <label for="website"> IFSC Number</label>
                                <input pInputText class="w-full" id="website" [formField]="vendorForm.ifsc">
                            </p-floatlabel>
                        </div>

                        <div class="border-1 mt-5 w-100"></div>
                        <div class="col-12 col-md-12 col-lg-12 col-sm-12 mb-3 mt-4">
                            <label for="description"> Description </label>
                            <textarea rows="4" class="w-full form-control" name="description"
                                [(ngModel)]="description"> </textarea>
                        </div>
                        <div class="col-12 col-md-12 col-lg-12 col-sm-12 mb-3 mt-3">
                            <label for="termCondition"> Term and condition </label>
                            <textarea rows="4" class="w-full  form-control" name="termCondition"
                                [(ngModel)]="termCondition"></textarea>
                        </div>
                    </div>
                </p-tabpanel>
                <p-tabpanel value="2">
                    <!-- Address Section -->
                    <div class="row">
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on" variant="on">
                                <input pInputText class="w-full" id="addressType"
                                    [formField]="vendorForm.address.addressType" />
                                <label> Address Type * </label>
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on" variant="on">
                                <input pInputText class="w-full" id="country" [formField]="vendorForm.address.country">
                                <label>
                                    Country *
                                </label>
                            </p-floatlabel>
                        </div>
                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">

                            <p-floatlabel variant="on" variant="on">

                                <input pInputText class="w-full" id="state" [formField]="vendorForm.address.state">

                                <label>
                                    State *
                                </label>

                            </p-floatlabel>

                        </div>


                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">

                            <p-floatlabel variant="on" variant="on">

                                <input pInputText class="w-full" id="city" [formField]="vendorForm.address.city">

                                <label>
                                    City *
                                </label>

                            </p-floatlabel>

                        </div>

                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on" variant="on">
                                <input pInputText class="w-full" id="city" [formField]="vendorForm.address.area">
                                <label>Area</label>
                            </p-floatlabel>
                        </div>

                        <div class="col-12 col-md-4 col-lg-4 col-sm-4 mb-3">
                            <p-floatlabel variant="on" variant="on">
                                <input pInputText class="w-full" id="pincode" [formField]="vendorForm.address.pincode">
                                <label> Pincode * </label>
                            </p-floatlabel>
                        </div>

                        <div class="col-12 col-md-6 col-lg-6 col-sm-6 mb-3">
                            <label for="description"> Address line 1 </label>
                            <textarea pTextarea rows="4" class="w-full" id="addressLine1" [(ngModel)]="addressLine1"
                                name="addressLine1"> </textarea>
                        </div>
                        <div class="col-12 col-md-6 col-lg-6 col-sm-6 mb-3">
                            <label for="description"> Address line 2 </label>
                            <textarea pTextarea rows="4" class="w-full" [(ngModel)]="addressLine2"
                                name="addressLine2"> </textarea>
                        </div>
                    </div>
                </p-tabpanel>
                <p-tabpanel value="3">
                    <div class="grid grid-cols-12 gap-8">
                        <div class="col-span-full lg:col-span-4">
                            <p-fileupload name="demo[]" (onUpload)="onUpload($event,'I')" [multiple]="false"
                                accept="image/*" maxFileSize="1000000" mode="advanced"
                                url="https://www.primefaces.org/cdn/api/upload.php" chooseLabel="Select identity image">
                                <ng-template #empty>
                                    <div *ngIf="this.url" class="m-auto">
                                        <img [src]="this.url" alt="Identity Image"
                                            style="max-width: 200px; max-height: 200px;" />
                                    </div>
                                    <div *ngIf="!this.url">Drag and drop files to here to upload.</div>
                                </ng-template>
                            </p-fileupload>
                        </div>
                        <div class="col-span-full lg:col-span-4">
                            <p-fileupload name="demo[]" (onUpload)="onUpload($event,'B')" [multiple]="false"
                                accept="image/*" maxFileSize="1000000" mode="advanced"
                                url="https://www.primefaces.org/cdn/api/upload.php" chooseLabel="Select banner image">
                                <ng-template #empty>
                                    <div *ngIf="this.bannerUrl" class="m-auto">
                                        <img [src]="this.bannerUrl" alt="Identity Image"
                                            style="max-width: 200px; max-height: 200px;" />
                                    </div>
                                    <div *ngIf="!bannerUrl">Drag and drop files to here to upload.</div>
                                </ng-template>
                            </p-fileupload>
                        </div>
                        <div class="col-span-full lg:col-span-4">
                            <p-fileupload name="demo[]" (onUpload)="onUpload($event,'L')" [multiple]="false"
                                accept="image/*" maxFileSize="1000000" mode="advanced"
                                url="https://www.primefaces.org/cdn/api/upload.php" chooseLabel="Select logo image">
                                <ng-template #empty>
                                    <div *ngIf="this.logoUrl" class="m-auto">
                                        <img [src]="this.logoUrl" alt="Identity Image"
                                            style="max-width: 200px; max-height: 200px;" />
                                    </div>
                                    <div *ngIf="!logoUrl">Drag and drop files to here to upload.</div>
                                </ng-template>
                            </p-fileupload>
                        </div>
                    </div>
                </p-tabpanel>
            </p-tabpanels>
        </p-tabs>
    </div>
</form>
