<p-toolbar>
    <ng-template #start>
        <div class="font-semibold text-xl mt-1 mb-1">Vendor configuration</div>
    </ng-template>
    <ng-template #end></ng-template>
</p-toolbar>

<div class="card d-flex flex-row gap-5">
    <div class="w-50">
        <p-panel header="Vendor type" [toggleable]="true">
            <p-table #dt1 [value]="vendorTypes()" dataKey="id" [rows]="10" [loading]="typeLoading()" [rowHover]="true"
                [rowsPerPageOptions]="[10, 20, 50, 100]" [showGridlines]="true" [lazy]="true" responsiveLayout="scroll">
                <ng-template #header>
                    <tr>
                        <th pSortableColumn="name">
                            Name
                        </th>
                        <th>
                            Action
                        </th>
                    </tr>
                    <tr>
                        <th><input type="text" pInputText class="w-full" id="vendorType" name="vendorType"
                                [(ngModel)]="vendorTypeData().name"></th>
                        <th><p-button class="w-100" [disabled]="vendorTypeData.name ? false:'true'" label="Save"
                                icon="pi pi-save" (onClick)="saveType(10)" outlined>
                            </p-button></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-type>
                    <tr>
                        <td>{{ type.name }}</td>
                        <td>
                            <p-button icon="pi pi-pencil" severity="info" (onClick)="editType(type)" [rounded]="true"
                                [text]="true" [title]="type.id">
                            </p-button>
                            <p-button icon="pi pi-trash" (onClick)="deleteType(type)" severity="danger" [rounded]="true"
                                [text]="true">
                            </p-button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="2" class="text-center">
                            No vendor type found.
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </p-panel>
    </div>
    <div class="w-50">
        <p-panel header="Vendor Category" [toggleable]="true">
            <p-table #dt1 [value]="vendorCategories()" dataKey="id" [rows]="10" [loading]="categoryLoading()"
                [rowHover]="true" [rowsPerPageOptions]="[10, 20, 50, 100]" [showGridlines]="true" [lazy]="true"
                responsiveLayout="scroll">
                <ng-template #header>
                    <tr>
                        <th pSortableColumn="name">
                            Name
                        </th>
                        <th>
                            Action
                        </th>
                    </tr>
                    <tr>
                        <th><input type="text" pInputText class="w-full" id="vendorcategory" name="name"
                                [(ngModel)]="vendorCategoryData().name"></th>
                        <th><p-button class="w-100" [disabled]="vendorCategoryData.name ? false:'true'" label="Save"
                                icon="pi pi-save" (onClick)="saveType(20)" outlined>
                            </p-button></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-type>
                    <tr>
                        <td>{{ type.name }}</td>
                        <td>
                            <p-button icon="pi pi-pencil" severity="info" (onClick)="editType(type)" [rounded]="true"
                                [text]="true" [title]="type.id">
                            </p-button>
                            <p-button icon="pi pi-trash" (onClick)="deleteType(type)" severity="danger" [rounded]="true"
                                [text]="true">
                            </p-button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="2" class="text-center">
                            No vendor type found.
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </p-panel>
    </div>
</div>
