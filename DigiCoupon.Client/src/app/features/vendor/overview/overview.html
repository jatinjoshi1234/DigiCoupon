<p-toolbar styleClass="gap-4">
    <ng-template #start>
        <div class="font-semibold text-xl">Vendors management</div>
    </ng-template>
    <ng-template #end>
        <p-inputgroup>
            <input pInputText placeholder="Search..." (input)="onSearch($event)" />
            <p-inputgroup-addon (click)="addVendor()">
                <i class="pi pi-plus"></i>
            </p-inputgroup-addon>
        </p-inputgroup>
    </ng-template>
</p-toolbar>
<p-table #dt1 [value]="vendors()" dataKey="id" [rows]="10" [loading]="loading" [rowHover]="true"
    [rowsPerPageOptions]="[10, 20, 50, 100]" [showGridlines]="true" [paginator]="true" [totalRecords]="totalRecords"
    [lazy]="true" (onLazyLoad)="getVendors($event)" [globalFilterFields]="['name', 'parentName']"
    (onSort)="onSort($event)" responsiveLayout="scroll">
    <ng-template #header>
        <tr>
            <th pSortableColumn="name">
                Vendor Name
                <p-sortIcon field="name"></p-sortIcon>
            </th>
            <th pSortableColumn="paretnName">
                Buisness Name
                <p-sortIcon field="paretnName"></p-sortIcon>
            </th>
            <th pSortableColumn="paretnName">
                Vendor Type
                <p-sortIcon field="paretnName"></p-sortIcon>
            </th>
            <th pSortableColumn="paretnName">
                Business Category
                <p-sortIcon field="paretnName"></p-sortIcon>
            </th>
            <th style="width:150px">
                Action
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-vendor>
        <tr>
            <td>{{ vendor.vendorName }}</td>
            <td>{{ vendor.businessName }}</td>
            <td>{{ vendor.type }}</td>
            <td>{{ vendor.category }}</td>
            <td>
                <p-button icon="pi pi-pencil" severity="info" [rounded]="true" [text]="true" [title]="vendor.id"
                    (onClick)="editVendor(vendor)">
                </p-button>

                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true"
                    (onClick)="deleteVendor(vendor)">
                </p-button>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="5" class="text-center">
                No categories found.
            </td>
        </tr>
    </ng-template>
</p-table>
